name: Release themes

on:
  push:
    branches: [main]
    paths: ["Themes/**", "links.json", "tools/**", "tests/**", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: theme-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests
      - run: python3 tools/build-manifest.py
      - name: Publish a permanent theme release
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          shopt -s nullglob
          assets=(Themes/*.clinktheme manifest.json)
          tag=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            # Always refresh assets — theme bytes are content-addressed by tag, but
            # links.json / descriptions live only in manifest.json and must update
            # in place when publisher copy changes.
            gh release upload "$tag" "${assets[@]}" --clobber
            if [ "$draft" = true ]; then
              gh release edit "$tag" --draft=false --latest
            else
              gh release edit "$tag" --latest
            fi
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" --title "Affiliate themes" --draft
            gh release edit "$tag" --draft=false --latest
          fi
